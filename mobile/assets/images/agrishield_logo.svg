<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16C784"/>
      <stop offset="100%" stop-color="#087A55"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8FF72"/>
      <stop offset="100%" stop-color="#42D99A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- Shield silhouette -->
  <path d="M256 30 L426 96 V224 C426 337 354 425 256 480 C158 425 86 337 86 224 V96 Z"
        fill="#0B2635"/>
  <path d="M256 49 L407 108 V222 C407 324 344 405 256 456 C168 405 105 324 105 222 V108 Z"
